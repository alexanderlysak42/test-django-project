{% extends 'base.html' %}

{% block title %}
    Project create
{% endblock %}

{% block content %}

<div class="container py-5">

    <h1 class="mb-4">
        Create project
    </h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-primary"
        >
            Create project
        </button>

        <a
            href="{% url 'projects_list' %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
