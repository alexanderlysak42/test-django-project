<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            Project Manager
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'projects_list' %}"
        >
            Project Manager
        </a>

        {% if user.is_authenticated %}

            <div class="d-flex align-items-center gap-2">

                <a
                    href="{% url 'projects_list' %}"
                    class="btn btn-outline-light btn-sm"
                >
                    Projects
                </a>

                <a
                    href="{% url 'tasks_list' %}"
                    class="btn btn-outline-light btn-sm"
                >
                    My tasks
                </a>

                <span class="text-light">
                    {{ user.username }}
                </span>

                <form
                    method="post"
                    action="{% url 'logout' %}"
                    class="d-inline"
                >
                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-outline-danger btn-sm"
                    >
                        Logout
                    </button>

                </form>

            </div>

        {% endif %}

    </div>

</nav>

<main class="container py-5">

    {% if messages %}

        {% for message in messages %}

            <div
                class="alert alert-{{ message.tags|default:'info' }}"
                role="alert"
            >
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
