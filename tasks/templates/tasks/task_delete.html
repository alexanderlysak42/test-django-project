{% extends 'base.html' %}

{% block title %}
    Task delete
{% endblock %}

{% block content %}

<div class="container py-5">

    <h1 class="mb-4">
        Delete task
    </h1>

    <div class="alert alert-warning">

        <p class="mb-0">
            Are you sure you want to delete task:
            <strong>{{ task.title }}</strong>?
        </p>

    </div>

    <form method="post">

        {% csrf_token %}

        <input type="hidden" name="next" value="{{ next }}">

        <button
            type="submit"
            class="btn btn-danger"
        >
            Yes, delete
        </button>

        <a
            href="{% url 'task_detail' project.id task.id %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
