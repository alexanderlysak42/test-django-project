{% extends 'base.html' %}

{% block title %}
    Task create
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="mb-4">

        <h1>
            Create task
        </h1>

        <p class="text-muted">
            Project: {{ project.name }}
        </p>

    </div>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="mt-4">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Create
            </button>

            <a
                href="{% url 'project_detail' project.id %}"
                class="btn btn-outline-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
